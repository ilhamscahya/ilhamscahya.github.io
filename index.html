<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ILHAM CAHYA SUHERMAN // CARD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0a0b0e;
            --bg-card: #11141c;
            --bg-header: #161a25;
            --bg-hover: #1c2230;
            --border-color: #262c3d;
            --border-bright: #3a445d;
            --text-primary: #e2e8f0;
            --text-muted: #8a99ad;
            --text-dim: #526075;
            --accent-cyan: #00f0ff;
            --accent-green: #00ff88;
            --accent-yellow: #ffcc00;
            --font-mono: 'JetBrains Mono', Courier, monospace;
            --shadow-glow: 0 0 15px rgba(0, 240, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.5;
            padding: 24px 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.06) 0%, transparent 70%),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 24px;
        }

        /* STRICT SVG SIZING PROTECTIONS */
        svg, .icon-svg {
            width: 16px !important;
            height: 16px !important;
            max-width: 16px !important;
            max-height: 16px !important;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
            display: inline-block;
            vertical-align: middle;
        }

        .card-container {
            width: 100%;
            max-width: 580px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            border-radius: 4px;
        }

        .card-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
        }

        .top-bar {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-primary);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--accent-green);
        }

        .sys-info {
            color: var(--text-muted);
            font-size: 10px;
        }

        .profile-section {
            padding: 24px 20px 20px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .prompt-tag {
            color: var(--accent-cyan);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 6px;
            display: block;
        }

        .user-name {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
            line-height: 1.2;
            margin-bottom: 6px;
        }

        .user-role {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .company-tag {
            color: var(--text-primary);
            background-color: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 2px;
            border: 1px solid var(--border-color);
            font-weight: 500;
            font-size: 11px;
        }

        .primary-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }

        .btn {
            padding: 10px 14px;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 2px;
            line-height: 1;
        }

        .btn-primary {
            background-color: var(--accent-cyan);
            color: #0a0b0e;
            border-color: var(--accent-cyan);
            box-shadow: var(--shadow-glow);
        }

        .btn-primary:hover {
            background-color: #33f3ff;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: rgba(0, 240, 255, 0.08);
            color: var(--accent-cyan);
            border-color: rgba(0, 240, 255, 0.3);
        }

        .btn-secondary:hover {
            background-color: rgba(0, 240, 255, 0.18);
            border-color: var(--accent-cyan);
        }

        .links-section {
            padding: 20px;
        }

        .section-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .link-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .link-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 2px;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
        }

        .link-card:hover {
            background-color: var(--bg-hover);
            border-color: var(--accent-cyan);
            transform: translateX(3px);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .link-icon-box {
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .link-meta {
            display: flex;
            flex-direction: column;
        }

        .link-label {
            font-size: 9px;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .link-value {
            font-size: 12px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .link-arrow {
            color: var(--text-dim);
            transition: color 0.2s ease;
        }

        .link-card:hover .link-arrow {
            color: var(--accent-cyan);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active { display: flex; }

        .modal-content {
            background-color: var(--bg-card);
            border: 1px solid var(--accent-cyan);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
            width: 100%;
            max-width: 320px;
            border-radius: 4px;
        }

        .modal-header {
            background-color: var(--bg-header);
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            color: var(--accent-cyan);
            font-size: 11px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            line-height: 1;
        }

        .close-btn:hover { color: var(--accent-cyan); }

        .modal-body {
            padding: 20px;
            text-align: center;
            font-size: 11px;
        }

        #qrcode-container {
            margin: 12px auto;
            display: flex;
            justify-content: center;
            padding: 10px;
            background-color: #ffffff;
            width: fit-content;
            border-radius: 4px;
        }

        .qr-desc {
            color: var(--text-muted);
            font-size: 10px;
            margin-top: 8px;
            word-break: break-all;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background-color: var(--accent-cyan);
            color: #000;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 11px;
            border-radius: 2px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 1001;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .card-footer {
            border-top: 1px solid var(--border-color);
            padding: 10px 16px;
            background-color: var(--bg-header);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 9px;
            color: var(--text-dim);
        }

        @media (max-width: 480px) {
            .primary-actions { grid-template-columns: 1fr; }
            .user-name { font-size: 22px; }
            .user-role { font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- TOP STATUS BAR -->
        <header class="top-bar">
            <div class="brand">
                <span class="status-dot"></span>
                <span>IDENTITY_NODE</span>
            </div>
            <div class="sys-info" id="clock">00:00:00 WIB</div>
        </header>

        <!-- PROFILE HERO -->
        <section class="profile-section">
            <span class="prompt-tag">// CONTACT_CARD</span>
            <h1 class="user-name" id="display-name">ILHAM CAHYA SUHERMAN</h1>
            
            <div class="user-role">
                <span id="display-role">Digital Product Manager</span>
                <span class="company-tag" id="display-company">@ Tech Lab Inc.</span>
            </div>

            <!-- ACTION BUTTONS -->
            <div class="primary-actions">
                <button class="btn btn-primary" onclick="downloadVCard()">
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                    SIMPAN (.VCF)
                </button>
                <button class="btn btn-secondary" onclick="toggleQRCode()">
                    <svg class="icon-svg" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                    QR CODE
                </button>
            </div>
        </section>

        <section class="links-section">
            <div class="section-title">
                <span>// CONNECT_NODES</span>
                <span>DIRECT_LINKS</span>
            </div>

            <div class="link-grid" id="link-container">
                <!-- Links dynamically rendered from JavaScript config -->
            </div>
        </section>

        <!-- FOOTER -->
        <footer class="card-footer">
            <div>STATUS: ONLINE</div>
            <div>&copy; <span id="year">2026</span> ILHAM CAHYA SUHERMAN</div>
        </footer>
    </div>

    <!-- QR CODE MODAL -->
    <div id="qr-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span>QR_SHARE_NODE</span>
                <button class="close-btn" onclick="toggleQRCode()">&times;</button>
            </div>
            <div class="modal-body">
                <p style="color: var(--text-primary); font-weight:700;">Scan untuk Buka Kartu Digital</p>
                <div id="qrcode-container"></div>
                <div class="qr-desc" id="qr-url-display">https://yourname.github.io</div>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast">NOTIFIKASI</div>

    <!-- EXTERNAL QR LIBRARY -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        /* ==========================================================================
           KONFIGURASI DATA DIRI (Cukup edit bagian objek di bawah ini)
           ========================================================================== */
        const USER_CONFIG = {
            fullName: "ILHAM CAHYA SUHERMAN",
            role: "Digital Product Manager",
            company: "Telkom Indonesia", // Isikan perusahaan/instansi saat ini
            
            // Daftar kontak & situs yang ingin ditampilkan
            contacts: [
                {
                    label: "EMAIL",
                    value: "ilham.suherman@telkom.co.id",
                    url: "mailto:ilham.suherman@telkom.co.id",
                    icon: `<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>`
                },
                {
                    label: "LINKEDIN",
                    value: "linkedin.com/in/ilhamscahya",
                    url: "https://linkedin.com/in/ilhamscahya",
                    icon: `<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>`
                },
                {
                    label: "WEBSITE",
                    value: "From Past to Future",
                    url: "https://fptf.ilhamcahya.my.id",
                    icon: `<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>`
                }
            ]
        };

        function downloadVCard() {
            const cleanPhone = USER_CONFIG.contacts.find(c => c.label.includes("TELP"))?.value || "";
            const email = USER_CONFIG.contacts.find(c => c.label === "EMAIL")?.value || "";
            const linkedin = USER_CONFIG.contacts.find(c => c.label === "LINKEDIN")?.url || "";
            const github = USER_CONFIG.contacts.find(c => c.label === "GITHUB")?.url || "";

            const vCardData = 
`BEGIN:VCARD
VERSION:3.0
FN:${USER_CONFIG.fullName}
TITLE:${USER_CONFIG.role}
ORG:${USER_CONFIG.company}
EMAIL;TYPE=INTERNET,WORK:${email}
TEL;TYPE=CELL:${cleanPhone}
URL:${window.location.href}
X-SOCIALPROFILE;TYPE=linkedin:${linkedin}
X-SOCIALPROFILE;TYPE=github:${github}
NOTE:Terminal Digital Business Card
END:VCARD`;

            const blob = new Blob([vCardData], { type: 'text/vcard;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${USER_CONFIG.fullName.replace(/\s+/g, '_')}_Contact.vcf`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showToast("[DOWNLOADED] File .VCF berhasil diunduh.");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (toast) {
                toast.innerText = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2800);
            }
        }

        let qrGenerated = false;

        function toggleQRCode() {
            const modal = document.getElementById('qr-modal');
            if (!modal) return;

            modal.classList.toggle('active');

            if (modal.classList.contains('active') && !qrGenerated) {
                const qrContainer = document.getElementById('qrcode-container');
                const qrUrlDisplay = document.getElementById('qr-url-display');
                
                qrContainer.innerHTML = "";
                const currentUrl = window.location.href;
                if (qrUrlDisplay) qrUrlDisplay.innerText = currentUrl;

                if (window.QRCode) {
                    new QRCode(qrContainer, {
                        text: currentUrl,
                        width: 160,
                        height: 160,
                        colorDark: "#0a0b0e",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                    qrGenerated = true;
                } else {
                    qrContainer.innerHTML = "<p style='color:red;'>QR Library Loading Failed</p>";
                }
            }
        }

        function updateClock() {
            const clockElem = document.getElementById('clock');
            const now = new Date();
            if (clockElem) clockElem.innerText = now.toLocaleTimeString('id-ID', { hour12: false }) + ' WIB';
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Render Text Profiles
            document.getElementById('display-name').innerText = USER_CONFIG.fullName;
            document.getElementById('display-role').innerText = USER_CONFIG.role;
            document.getElementById('display-company').innerText = "@ " + USER_CONFIG.company;
            document.getElementById('year').innerText = new Date().getFullYear();

            // Render Links
            const container = document.getElementById('link-container');
            container.innerHTML = USER_CONFIG.contacts.map(item => `
                <a href="${item.url}" target="_blank" class="link-card">
                    <div class="link-left">
                        <div class="link-icon-box">
                            <svg class="icon-svg" viewBox="0 0 24 24">${item.icon}</svg>
                        </div>
                        <div class="link-meta">
                            <span class="link-label">${item.label}</span>
                            <span class="link-value">${item.value}</span>
                        </div>
                    </div>
                    <div class="link-arrow">
                        <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
                    </div>
                </a>
            `).join('');

            // Realtime Clock
            updateClock();
            setInterval(updateClock, 1000);
        });
    </script>
</body>
</html>
